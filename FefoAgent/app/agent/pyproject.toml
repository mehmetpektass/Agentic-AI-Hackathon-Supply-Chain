[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "mcp >= 1.30.0, < 2.0.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1, < 2.0.0",
    "botocore[crt] ~= 1.43.0",
    "strands-agents >= 1.62.0, < 2.0.0",
    "fpdf2 >= 2.8.0, < 3.0.0",
    "openpyxl >= 3.1.0, < 4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pytest >= 8.0",
]

[tool.uv]
# fonttools 4.69.0 (fpdf2 dependency) publishes only cp311 wheels; skip it so Python 3.12 resolves.
constraint-dependencies = ["fonttools != 4.69.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
